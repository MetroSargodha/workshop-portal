<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>یومیہ کارکردگی جدول — ورکشاپ ذمہ دار</title>
<!-- ExcelJS is loaded on-demand (see loadExcelJS) only when the user actually exports, to keep initial page load fast -->
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241f19; --ink-soft:#6b6152; --ink-faint:#a89d88;
    --paper:#faf6ee; --card:#ffffff; --line:#ece2cb; --line-soft:#f2ead9;
    --green-950:#0a2e22; --green-900:#0e3d2c; --green-800:#125239; --green-700:#177049;
    --green-600:#1f9160; --green-100:#e3f2e7; --green-50:#f2f8f1;
    --gold-700:#8a6a1a; --gold-600:#b8933a; --gold-500:#cda94f; --gold-100:#f7ecd2;
    --amber-600:#b45309; --red-600:#b91c1c; --red-100:#fdecea;
    --font-display:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq',serif;
    --font-body:'Noto Naskh Arabic','Segoe UI',Tahoma,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body);
    line-height:1.8;
    background-image:radial-gradient(circle at 100% 0%, rgba(23,112,73,.05), transparent 45%),
                      radial-gradient(circle at 0% 100%, rgba(184,147,58,.06), transparent 40%);
  }
  .wrap{max-width:1040px; margin:0 auto; padding:22px 16px 70px;}

  .header{
    position:relative; background:linear-gradient(155deg,var(--green-950),var(--green-700) 85%);
    border-radius:20px; padding:30px 20px 24px; margin-bottom:20px;
    box-shadow:0 10px 30px -12px rgba(14,61,44,.5); text-align:center; overflow:hidden;
  }
  .header::before{
    content:''; position:absolute; inset:0;
    background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 2px, transparent 2px 22px);
    pointer-events:none;
  }
  .header-mark{display:block; color:var(--gold-500); font-size:15px; letter-spacing:10px; margin-bottom:10px;}
  .header h1{color:#fff; font-family:var(--font-display); font-size:24px; margin:0; font-weight:700;}
  .header .header-sub{color:#cfe9da; margin:8px 0 0; font-size:13px; letter-spacing:.3px;}
  .header-rule{width:120px; height:2px; margin:16px auto 0; background:linear-gradient(90deg,transparent,var(--gold-500),transparent); position:relative; z-index:1;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px;
    margin-bottom:16px; box-shadow:0 1px 2px rgba(36,31,25,.04);
  }
  .grid{display:grid; gap:12px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-6{grid-template-columns:repeat(6,1fr);}
  @media(max-width:760px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} .grid-6{grid-template-columns:repeat(2,1fr);}}

  label.field{display:flex; flex-direction:column; gap:6px;}
  .field span{font-size:12px; color:var(--ink-soft); text-align:right; font-weight:600;}
  input, select, textarea{
    border:1px solid var(--line); border-radius:10px; padding:10px 11px; font-size:14px;
    text-align:right; font-family:inherit; background:#fff; color:var(--ink); width:100%;
  }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--green-600); box-shadow:0 0 0 3px rgba(31,145,96,.14);}
  input:disabled, select:disabled{background:var(--line-soft); color:var(--ink-soft); cursor:not-allowed;}

  .toolbar{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px;
    margin-bottom:16px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 16px;
  }
  .toolbar-left, .toolbar-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--green-700); color:#fff; border:none;
    border-radius:10px; padding:10px 18px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
    transition:background .15s, transform .1s;
  }
  .btn:hover{background:var(--green-800);}
  .btn:active{transform:scale(.98);}
  .btn:disabled{background:var(--line-soft); color:var(--ink-faint); cursor:not-allowed;}
  .btn.secondary{background:#efe9db; color:var(--green-800); border:1px solid var(--line);}
  .btn.secondary:hover{background:#e6ddc4;}
  .btn.danger{background:var(--red-100); color:var(--red-600); border:1px solid #f6c6c1;}
  .btn.danger:hover{background:#fbdcd9;}
  .btn.small{padding:7px 12px; font-size:12px; border-radius:9px;}
  .muted{color:var(--ink-faint); font-size:13px;}
  .save-tag{font-size:12px; color:var(--ink-faint); display:flex; align-items:center; gap:5px; font-weight:600;}
  .save-tag.saved, .save-tag.synced{color:var(--green-700);}
  .save-tag.warn{color:var(--amber-600);}

  /* role switcher */
  .role-switch{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .role-btn{
    flex:1; min-width:160px; background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:11px 14px; cursor:pointer; font-family:inherit; font-size:13px; font-weight:700;
    color:var(--ink-soft); text-align:center; transition:all .12s;
  }
  .role-btn.active{background:var(--green-700); color:#fff; border-color:var(--green-700); box-shadow:0 4px 14px -6px rgba(23,112,73,.6);}
  .role-sub{display:flex; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap;}
  .role-sub select{max-width:260px;}

  .approve-banner{
    background:linear-gradient(135deg,var(--green-800),var(--green-600)); color:#fff; border-radius:14px;
    padding:14px 18px; margin-bottom:16px; display:flex; align-items:center; gap:10px; font-size:13px;
    font-weight:600; box-shadow:0 6px 18px -8px rgba(14,61,44,.5); flex-wrap:wrap;
  }
  .approve-banner .big{font-size:15px; font-family:var(--font-display);}
  .info-banner{
    background:var(--gold-100); color:var(--gold-700); border:1px solid #ecd9a8; border-radius:14px;
    padding:13px 18px; margin-bottom:16px; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .plain-banner{
    background:var(--line-soft); color:var(--ink-soft); border-radius:14px; padding:13px 18px;
    margin-bottom:16px; font-size:13px; text-align:center;
  }

  /* districts setup */
  .district-row{display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap;}
  .district-row input{flex:1; min-width:110px;}
  .district-remove{background:none; border:none; color:var(--red-600); font-size:20px; cursor:pointer; flex-shrink:0; width:30px; height:30px;}

  .days-card{padding:8px 10px;}
  .day-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 10px; border-bottom:1px solid var(--line-soft); border-radius:10px;
    transition:background .12s;
  }
  .day-item:last-child{border-bottom:none;}
  .day-item:hover{background:var(--green-50);}
  .day-item-main{display:flex; align-items:center; gap:12px; min-width:0;}
  .day-num{
    width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; background:var(--line-soft); color:var(--ink-faint); flex-shrink:0;
    border:1px solid var(--line);
  }
  .day-num.is-filled{background:var(--green-700); color:#fff; border-color:var(--green-700);}
  .day-num.is-pending{background:var(--gold-600); color:#fff; border-color:var(--gold-600);}
  .day-num.is-auto{background:#4f46e5; color:#fff; border-color:#4f46e5;}
  .day-num.is-holiday{background:#9ca3af; color:#fff; border-color:#9ca3af;}
  .day-text{text-align:right; min-width:0;}
  .day-text .d1{font-family:var(--font-display); font-size:15px; font-weight:700; color:var(--ink);}
  .day-text .d1 i{font-style:normal; color:var(--ink-faint); margin:0 4px;}
  .day-text .d2{font-size:12px; color:var(--ink-faint); margin-top:2px;}
  .day-item-side{display:flex; align-items:center; gap:9px; flex-shrink:0;}
  .status-pill{
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px;
    background:var(--line-soft); color:var(--ink-faint); white-space:nowrap;
  }
  .status-pill.pending{background:var(--gold-100); color:var(--gold-700);}
  .status-pill.signed{background:var(--green-100); color:var(--green-800);}
  .status-pill.auto{background:#e0e7ff; color:#4338ca;}
  .status-pill.holiday{background:#e5e7eb; color:#374151;}
  @media(max-width:600px){ .status-pill{display:none;} .day-text .d2{display:none;} }

  .summary-box{background:var(--green-50); border:1px solid var(--green-100); border-radius:12px; padding:12px 8px; text-align:center;}
  .summary-box .lbl{font-size:11px; color:var(--ink-soft); font-weight:600;}
  .summary-box .val{font-size:20px; font-weight:800; color:var(--green-800); margin-top:2px;}
  h2.section-title{
    font-family:var(--font-display); font-size:16px; font-weight:700; color:var(--green-900);
    margin:0 0 14px; text-align:right; display:flex; align-items:center; gap:8px;
  }
  h2.section-title::before{content:''; width:5px; height:5px; border-radius:50%; background:var(--gold-500); flex-shrink:0;}

  .loading{display:flex; align-items:center; justify-content:center; gap:8px; padding:70px 0; color:var(--ink-faint);}
  .spin{width:16px; height:16px; border:2px solid var(--line); border-top-color:var(--green-600); border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,25,20,.55); backdrop-filter:blur(2px);
    display:flex; align-items:flex-end; justify-content:center; z-index:100; padding:0;
    animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  @media(min-width:640px){ .modal-overlay{align-items:center; padding:24px;} }
  .modal-card{
    background:var(--paper); width:100%; max-width:640px; max-height:92vh; overflow-y:auto;
    border-radius:20px 20px 0 0; box-shadow:0 -8px 40px rgba(10,30,22,.25);
    animation:slideUp .18s ease;
  }
  @media(min-width:640px){ .modal-card{border-radius:20px; animation:popIn .16s ease;} }
  @keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  @keyframes popIn{from{transform:scale(.97); opacity:0;} to{transform:scale(1); opacity:1;}}
  .modal-card.wide{max-width:1100px;}
  .modal-head{
    position:sticky; top:0; z-index:2; background:linear-gradient(155deg,var(--green-950),var(--green-700) 85%);
    color:#fff; padding:18px 18px 16px; border-radius:20px 20px 0 0; display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  }
  .modal-title{font-family:var(--font-display); font-size:17px; font-weight:700;}
  .modal-sub{font-size:12px; color:#cfe9da; margin-top:4px;}
  .modal-close{
    background:rgba(255,255,255,.14); border:none; color:#fff; width:30px; height:30px; border-radius:50%;
    font-size:18px; line-height:1; cursor:pointer; flex-shrink:0;
  }
  .modal-close:hover{background:rgba(255,255,255,.26);}
  .modal-body{padding:18px;}
  .modal-body .grid{margin-bottom:14px;}
  .modal-foot{
    position:sticky; bottom:0; background:var(--paper); border-top:1px solid var(--line);
    padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }

  .sig-wrap{display:flex; flex-direction:column; gap:6px; align-items:flex-end;}
  .sig-pad{border:1.5px dashed var(--gold-500); border-radius:12px; background:#fff; touch-action:none; cursor:crosshair; width:100%; max-width:320px; height:110px;}
  .sig-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .sig-label{font-size:12px; color:var(--ink-soft); text-align:right; font-weight:600; margin-bottom:2px;}
  .sig-hint{font-size:11px; color:var(--ink-faint); margin-top:2px;}
  .sig-preview{display:flex; flex-direction:column; align-items:flex-end; gap:6px;}
  .sig-preview img{max-width:220px; max-height:90px; border:1px solid var(--line); border-radius:10px; background:#fff; padding:6px;}

  .locked-note{
    background:var(--green-50); border:1px dashed var(--green-100); border-radius:10px; padding:10px 12px;
    font-size:12px; color:var(--green-800); text-align:right; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
  }
  .reject-note{background:var(--red-100); border:1px solid #f6c6c1; border-radius:10px; padding:10px 12px; font-size:12px; color:var(--red-600); text-align:right; margin-bottom:12px;}
  .readonly-grid input{background:var(--line-soft); color:var(--ink-soft);}

  .division-table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px; margin-bottom:16px;}
  table.division-table{width:100%; border-collapse:collapse; font-size:12px; min-width:640px;}
  table.division-table th, table.division-table td{border:1px solid var(--line); padding:8px 6px; text-align:center;}
  table.division-table th{background:var(--green-100); color:var(--green-900);}
  table.division-table tr.st-pending td{background:var(--gold-100);}
  table.division-table tr.st-signed td{background:var(--green-50);}

  .xp-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:12px;}
  table.xp-table{border-collapse:collapse; width:100%; min-width:1160px; font-size:11px;}
  table.xp-table td{border:1px solid #e3dcc8; padding:6px 5px; text-align:center; white-space:nowrap; color:var(--ink);}
  table.xp-table tr.xp-title td{background:var(--green-950); color:#fff; font-weight:700; font-size:13px; white-space:normal;}
  table.xp-table tr.xp-info td{background:var(--green-700); color:#fff; font-weight:600;}
  table.xp-table tr.xp-head td{background:var(--green-100); color:var(--green-900); font-weight:700; white-space:normal;}
  table.xp-table tr.xp-band td{background:#fbf8f1;}
  table.xp-table tr.xp-sub td{background:var(--gold-100); color:var(--gold-700); font-weight:700;}
  table.xp-table img.xp-sig{max-height:24px; max-width:70px;}
  .xp-note{font-size:12px; color:var(--ink-soft); margin-top:12px; text-align:right; line-height:1.8;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
  "use strict";

  var URDU_MONTHS = ['جنوری','فروری','مارچ','اپریل','مئی','جون','جولائی','اگست','ستمبر','اکتوبر','نومبر','دسمبر'];
  var EN_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var URDU_DAYS = ['اتوار','پیر','منگل','بدھ','جمعرات','جمعہ','ہفتہ'];

  var FIELD_DEFS = [
    { key:'boxesReceived', label:'بکس وصول کئے' },
    { key:'generalRepair', label:'عمومی مرمت کئے' },
    { key:'generalScrap', label:'عمومی سکریپ کئے' },
    { key:'specialRepair', label:'خصوصی مرمت کئے' },
    { key:'specialScrap', label:'خصوصی سکریپ کئے' },
    { key:'lockRepair', label:'لاک مرمت کئے' }
  ];

  var EXTRA_FIELDS = [
    { key:'otherWork', label:'دیگر کام کیے', type:'text' },
    { key:'bagNumber', label:'بیگ نمبر', type:'text' },
    { key:'fareKm', label:'کرایہ / کلومیٹر', type:'text' },
    { key:'cityArea', label:'مخصوص علاقہ / محلہ', type:'text' },
    { key:'departureTime', label:'وقت رخصت', type:'time' },
    { key:'arrivalTime', label:'وقت آمد', type:'time' }
  ];

  var SUMMARY_FIELDS = [
    { key:'totalSalary', label:'کل مشاہرہ' },
    { key:'travelExpenses', label:'سفری اخراجات' },
    { key:'outsideSchedule', label:'بیرونی جدول' },
    { key:'dailyFikreMadina', label:'روزانہ فکر مدینہ' },
    { key:'weeklyMuzakra', label:'ہفتہ وار مدنی مذاکرہ میں شرکت' },
    { key:'weeklyIjtima', label:'ہفتہ وار اجتماع میں شرکت' },
    { key:'madaniInaamat', label:'مدنی انعامات' },
    { key:'totalLeaveDays', label:'کل ایام رخصت' },
    { key:'totalAbsentDays', label:'کل ایام غیر حاضری' },
    { key:'totalPresentDays', label:'کل ایام حاضری' }
  ];

  var MERGE_RANGES_TEMPLATE = [
    'A1:Q1','E2:H2','I2:L2','M2:Q2','C3:D3','K3:Q3',
    'A4:A5','B4:B5','C4:D4','E4:E5','F4:F5','G4:G5','H4:H5','I4:I5','J4:J5','K4:K5','L4:L5','M4:M5','N4:N5','O4:Q4',
    'L37:Q37','A38:Q38',
    'A39:A40','B39:D40','E39:E40','F39:F40','G39:G40','H39:H40','I39:I40','J39:L39','M39:N40','O39:P40','Q39:Q40',
    'B41:D41','M41:N41','O41:P41','A42:M42','N42:Q42'
  ];

  var COLS = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O','P','Q'];

  function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
  function hijriLabel(date){
    try{ return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long'}).format(date); }
    catch(e){ return ''; }
  }
  function gregLabel(date){ return String(date.getDate()).padStart(2,'0') + ' ' + URDU_MONTHS[date.getMonth()]; }
  function fmtDateTime(iso){
    if(!iso) return '';
    try{
      var d = new Date(iso);
      return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    }catch(e){ return ''; }
  }
  function emptyEntry(){
    var e = { officeSignature:'', hasSignature:false, district:'', officeSignedBy:'', officeSignedAt:'', officeNote:'', dayType:'' };
    FIELD_DEFS.forEach(function(f){ e[f.key] = ''; });
    EXTRA_FIELDS.forEach(function(f){ e[f.key] = ''; });
    return e;
  }
  function emptySummary(){
    var s = {};
    SUMMARY_FIELDS.forEach(function(f){ s[f.key] = ''; });
    return s;
  }
  function esc(v){
    return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function genCode(){ return String(Math.floor(1000 + Math.random()*9000)); }
  function dayTypeLabel(dt){ return dt === 'leave' ? 'رخصت' : (dt === 'qafila' ? 'مدنی قافلہ' : ''); }
  function entryHasData(e){
    if(!e) return false;
    if(e.dayType === 'leave' || e.dayType === 'qafila') return true;
    return FIELD_DEFS.concat(EXTRA_FIELDS).some(function(f){ return e[f.key] !== '' && e[f.key] != null; });
  }
  function isSunday(day){
    if(!day) return false;
    return new Date(state.year, state.month-1, day).getDay() === 0;
  }
  function entryStatus(e, day){
    if(!e) e = emptyEntry();
    if(e.dayType === 'leave' || e.dayType === 'qafila') return 'auto';
    var hasRealData = !!e.district || FIELD_DEFS.concat(EXTRA_FIELDS).some(function(f){ return e[f.key] !== '' && e[f.key] != null; });
    if(!hasRealData){
      if(isSunday(day)) return 'holiday';
      return 'empty';
    }
    if(!e.officeSignedAt) return 'pending';
    return 'signed';
  }
  function statusLabel(st, dayType){
    if(st === 'holiday') return '✓ ہفتہ وار تعطیل';
    if(st === 'auto') return '✓ '+dayTypeLabel(dayType)+' (خودکار)';
    return st === 'signed' ? '✓ دفتر سے تصدیق شدہ' : (st === 'pending' ? 'دفتر تصدیق کا منتظر' : 'نامکمل');
  }
  function districtOfficer(name){
    var d = state.districts.find(function(x){ return x.name === name; });
    return d ? d.officer : '';
  }

  // ---- storage abstraction: Claude artifact storage, else localStorage (for standalone use) ----
  var hasClaudeStorage = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');
  async function storageGet(key){
    if(hasClaudeStorage){
      try{ var r = await window.storage.get(key); return r ? r.value : null; }catch(e){ return null; }
    }
    try{ return localStorage.getItem('workshopPortal:'+key); }catch(e){ return null; }
  }
  async function storageSet(key, value){
    if(hasClaudeStorage){
      try{ await window.storage.set(key, value); return true; }catch(e){ return false; }
    }
    try{ localStorage.setItem('workshopPortal:'+key, value); return true; }catch(e){ return false; }
  }

  // ---- state ----
  var state = {
    year: 2026,
    month: 7,
    profile: { city:'', mobile:'', name:'', workshopCount:'' },
    settings: { sheetUrl:'https://script.google.com/macros/s/AKfycbwXvcy7rSylCV6wu10qDe6H4mQFk4jdGt50dfq8q1y7VNc1qdxHElQoaxohe5QbqR2YwA/exec', superAdminUsername:'', superAdminPassword:'', workshopUsername:'', workshopPassword:'', divisionUsername:'', divisionPassword:'', divisionOfficeUsername:'', divisionOfficePassword:'' },
    districts: [],
    entries: {},
    summary: emptySummary(),
    division: { signedBy:'', signature:'', signedAt:'' },
    loading: true,
    saveState: 'idle',
    entryModalDay: null,
    entryModalMode: 'workshop',
    showExcelPreview: false,
    role: 'workshop',
    activeDistrict: '',
    roleLocked: false,
    session: null,
    loginError: '',
    configLoaded: false
  };
  var saveTimer = null;
  var loadedKey = '';

  function monthKey(){ return 'month-' + state.year + '-' + String(state.month).padStart(2,'0'); }
  function isMonthApproved(){ return !!(state.division && state.division.signedAt); }
  function monthReadyForDivision(){
    var nDays = daysInMonth(state.year, state.month);
    var any = false;
    for(var d=1; d<=nDays; d++){
      var st = entryStatus(state.entries[d], d);
      if(st === 'empty' || st === 'holiday') continue;
      any = true;
      if(st === 'pending') return false;
    }
    return any;
  }
  function pendingDivisionItems(){
    var nDays = daysInMonth(state.year, state.month);
    var items = [];
    for(var d=1; d<=nDays; d++){
      var e = state.entries[d];
      if(entryStatus(e, d) === 'pending'){
        var date = new Date(state.year, state.month-1, d);
        items.push(gregLabel(date) + ' — ' + (e.district || '—'));
      }
    }
    return items;
  }
  function filledDaysList(){
    var nDays = daysInMonth(state.year, state.month);
    var list = [];
    for(var d=1; d<=nDays; d++){
      var e = state.entries[d];
      if(entryHasData(e)) list.push({ day:d, e:e, status:entryStatus(e, d) });
    }
    return list;
  }

  async function loadProfile(){
    var cfg = await fetchFromSheet('config');
    if(cfg){
      if(cfg.profile) state.profile = cfg.profile;
      if(cfg.districts) state.districts = cfg.districts;
      if(cfg.settings) state.settings = Object.assign(state.settings, cfg.settings);
      // keep the local cache fresh, but don't block on it — no network call needed here
      storageSet('profile-info', JSON.stringify(state.profile));
      storageSet('districts-info', JSON.stringify(state.districts));
      storageSet('settings-info', JSON.stringify(state.settings));
    } else {
      try{ var v = await storageGet('profile-info'); if(v) state.profile = JSON.parse(v); }catch(e){}
      try{ var ds = await storageGet('districts-info'); if(ds) state.districts = JSON.parse(ds); }catch(e){}
      try{ var s = await storageGet('settings-info'); if(s) state.settings = Object.assign(state.settings, JSON.parse(s)); }catch(e){}
    }
    if(!state.settings.sheetUrl){
      state.settings.sheetUrl = 'https://script.google.com/macros/s/AKfycbwXvcy7rSylCV6wu10qDe6H4mQFk4jdGt50dfq8q1y7VNc1qdxHElQoaxohe5QbqR2YwA/exec';
    }
    if(!cfg){ saveConfig(); } // nothing on the sheet yet (or offline) — push what we have in the background, don't block on it
    resolveSession();
    state.configLoaded = true;
  }

  function loadStoredSession(){
    try{ var raw = localStorage.getItem('workshopPortal:session'); if(raw) return JSON.parse(raw); }catch(e){}
    return null;
  }
  function saveStoredSession(sess){ try{ localStorage.setItem('workshopPortal:session', JSON.stringify(sess)); }catch(e){} }
  function clearStoredSession(){ try{ localStorage.removeItem('workshopPortal:session'); }catch(e){} }

  function validateSession(sess){
    if(!sess) return null;
    if(sess.type === 'superadmin'){
      return (state.settings.superAdminUsername && sess.username === state.settings.superAdminUsername) ? sess : null;
    }
    if(sess.type === 'workshop'){
      return (state.settings.workshopUsername && sess.username === state.settings.workshopUsername) ? sess : null;
    }
    if(sess.type === 'division'){
      return (state.settings.divisionUsername && sess.username === state.settings.divisionUsername) ? sess : null;
    }
    if(sess.type === 'divisionOffice'){
      return (state.settings.divisionOfficeUsername && sess.username === state.settings.divisionOfficeUsername) ? sess : null;
    }
    if(sess.type === 'office'){
      var d = state.districts.find(function(x){ return x.username && x.username === sess.username && x.name === sess.district; });
      return d ? sess : null;
    }
    return null;
  }

  function applySession(sess){
    state.session = sess;
    state.roleLocked = true;
    if(sess.type === 'superadmin'){ state.role = 'admin'; state.activeDistrict = ''; }
    else if(sess.type === 'workshop'){ state.role = 'workshop'; state.activeDistrict = ''; }
    else if(sess.type === 'division'){ state.role = 'division'; state.activeDistrict = ''; }
    else if(sess.type === 'divisionOffice'){ state.role = 'monitor'; state.activeDistrict = ''; }
    else if(sess.type === 'office'){ state.role = 'office'; state.activeDistrict = sess.district; }
  }

  function resolveSession(){
    // first-run bootstrap: no super-admin account configured yet -> let the first person in set one up
    if(!state.settings.superAdminUsername){
      applySession({ type:'superadmin', username:'' });
      return;
    }
    var stored = validateSession(loadStoredSession());
    if(stored){ applySession(stored); }
    else { clearStoredSession(); state.session = null; }
  }

  async function attemptLogin(username, password){
    username = (username||'').trim();
    password = (password||'').trim();
    if(!username || !password){ state.loginError = 'یوزرنیم اور پاسورڈ درج کریں۔'; render(); return; }

    if(state.settings.superAdminUsername && username === state.settings.superAdminUsername && password === state.settings.superAdminPassword){
      var s0 = { type:'superadmin', username: username }; saveStoredSession(s0); applySession(s0); state.loginError=''; state.loading=false; render(); return;
    }
    if(state.settings.workshopUsername && username === state.settings.workshopUsername && password === state.settings.workshopPassword){
      var s1 = { type:'workshop', username: username }; saveStoredSession(s1); applySession(s1); state.loginError=''; await loadMonth(); return;
    }
    if(state.settings.divisionUsername && username === state.settings.divisionUsername && password === state.settings.divisionPassword){
      var s2 = { type:'division', username: username }; saveStoredSession(s2); applySession(s2); state.loginError=''; await loadMonth(); return;
    }
    if(state.settings.divisionOfficeUsername && username === state.settings.divisionOfficeUsername && password === state.settings.divisionOfficePassword){
      var s2b = { type:'divisionOffice', username: username }; saveStoredSession(s2b); applySession(s2b); state.loginError=''; await loadMonth(); return;
    }
    var d = state.districts.find(function(x){ return x.username && x.username === username && x.password === password; });
    if(d){
      var s3 = { type:'office', username: username, district: d.name }; saveStoredSession(s3); applySession(s3); state.loginError=''; await loadMonth(); return;
    }
    state.loginError = 'غلط یوزرنیم یا پاسورڈ۔';
    render();
  }

  function handleLogout(){
    clearStoredSession();
    state.session = null; state.role = 'workshop'; state.roleLocked = false; state.activeDistrict = '';
    render();
  }

  var configSaveTimer = null;
  function scheduleConfigSave(){
    if(configSaveTimer) clearTimeout(configSaveTimer);
    configSaveTimer = setTimeout(saveConfig, 500);
  }
  async function saveConfig(){
    await storageSet('profile-info', JSON.stringify(state.profile));
    await storageSet('districts-info', JSON.stringify(state.districts));
    await storageSet('settings-info', JSON.stringify(state.settings));
    if(state.settings.sheetUrl){
      try{
        await fetch(state.settings.sheetUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ month: 'config', json: JSON.stringify({ profile: state.profile, districts: state.districts, settings: state.settings }) })
        });
      }catch(e){}
    }
  }

  async function fetchFromSheet(key){
    if(!state.settings.sheetUrl) return null;
    try{
      var resp = await fetch(state.settings.sheetUrl + '?month=' + encodeURIComponent(key));
      var j = await resp.json();
      if(j && j.found && j.json) return JSON.parse(j.json);
    }catch(e){}
    return null;
  }
  async function loadMonth(preRemote, preLocalRaw){
    state.loading = true;
    render();
    var key = monthKey();

    if(saveTimer){
      clearTimeout(saveTimer);
      saveTimer = null;
      if(loadedKey && loadedKey !== key){
        try{ await storageSet(loadedKey, JSON.stringify({ entries: state.entries, summary: state.summary, division: state.division })); }catch(e){}
      }
    }

    var pair = (preRemote !== undefined)
      ? await Promise.all([preRemote, preLocalRaw])
      : await Promise.all([fetchFromSheet(key), storageGet(key)]); // run network + local lookup together, not one after another
    var remote = pair[0], localRaw = pair[1];
    var local = null;
    if(localRaw){ try{ local = JSON.parse(localRaw); }catch(e){ local = null; } }

    var data = remote || local;
    state.entries = (data && data.entries) || {};
    state.summary = Object.assign(emptySummary(), (data && data.summary) || {});
    state.division = Object.assign({ signedBy:'', signature:'', signedAt:'', hasSignature:false }, (data && data.division) || {});
    Object.keys(state.entries).forEach(function(d){
      state.entries[d] = Object.assign(emptyEntry(), state.entries[d]);
    });

    loadedKey = key;
    state.loading = false;
    render();
  }

  function scheduleSave(){
    state.saveState = 'saving';
    renderSaveTagOnly();
    if(saveTimer) clearTimeout(saveTimer);
    var key = monthKey();
    saveTimer = setTimeout(async function(){
      var payload = JSON.stringify({ entries: state.entries, summary: state.summary, division: state.division });
      await storageSet(key, payload); // always saved locally first — this device's own view/export never depends on the network
      state.saveState = 'saved';
      renderSaveTagOnly();
      if(state.settings.sheetUrl){
        if(payload.length > 45000){
          state.saveState = 'too-large';
          renderSaveTagOnly();
          return;
        }
        state.saveState = 'syncing';
        renderSaveTagOnly();
        try{
          await fetch(state.settings.sheetUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ month: key, json: payload })
          });
          state.saveState = 'synced';
        }catch(e){ state.saveState = 'sync-error'; }
        renderSaveTagOnly();
      }
    }, 600);
  }



  function updateEntry(day, key, value){
    if(!state.entries[day]) state.entries[day] = emptyEntry();
    state.entries[day][key] = value;
    scheduleSave();
  }
  function updateSummary(key, value){ state.summary[key] = value; scheduleSave(); }
  function updateDivisionField(key, value){ state.division[key] = value; scheduleSave(); }

  function computeSubtotals(){
    var nDays = daysInMonth(state.year, state.month);
    var subtotals = {};
    FIELD_DEFS.forEach(function(f){
      var sum = 0;
      for(var d=1; d<=nDays; d++){
        var e = state.entries[d];
        var n = parseFloat(e ? e[f.key] : '');
        if(!isNaN(n)) sum += n;
      }
      subtotals[f.key] = sum;
    });
    return subtotals;
  }
  function countFilledDays(){
    var n = 0;
    Object.keys(state.entries).forEach(function(d){ if(entryHasData(state.entries[d])) n++; });
    return n;
  }

  function loadExcelJS(){
    if(window.ExcelJS) return Promise.resolve();
    if(window.__exceljsLoading) return window.__exceljsLoading;
    window.__exceljsLoading = new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
    return window.__exceljsLoading;
  }

      ws2.getCell('A'+rIdx).value = 'نام: ' + (state.division.signedBy || '—');
      ws2.getCell('C'+rIdx).value = 'تاریخ: ' + (fmtDateTime(state.division.signedAt) || '—');
      ws2.getCell('E'+rIdx).value = isMonthApproved() ? '✓ حتمی منظور شدہ' : 'منظوری زیر التوا';
      ws2.mergeCells('A'+rIdx+':B'+rIdx); ws2.mergeCells('C'+rIdx+':D'+rIdx); ws2.mergeCells('E'+rIdx+':F'+rIdx);
      ws2.getRow(rIdx).height = 26;
      ws2.getRow(rIdx).eachCell({includeEmpty:true}, function(cell){
        cell.alignment = { horizontal:'center', vertical:'middle', readingOrder:'rtl' };
        cell.font = { size:10, bold:true, color:{argb:'FF2B2620'} };
        cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFFBF8F1'} };
        cell.border = { top:{style:'thin',color:{argb:'FFE3DCC8'}}, left:{style:'thin',color:{argb:'FFE3DCC8'}},
          bottom:{style:'thin',color:{argb:'FFE3DCC8'}}, right:{style:'thin',color:{argb:'FFE3DCC8'}} };
      });
      if(state.division.signature){
        try{
          var b64d = state.division.signature.split(',')[1] || state.division.signature;
          var imgId3 = workbook.addImage({ base64:b64d, extension:'png' });
          ws2.addImage(imgId3, { tl:{ col:5.2, row:(rIdx-2)+0.1 }, ext:{ width:110, height:36 } });
        }catch(err){}
      }

      var buf = await workbook.xlsx.writeBuffer();
      var blob = new Blob([buf], { type: 'application/octet-stream' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'Workshop_Jadwal_' + year + '-' + String(month).padStart(2,'0') + '.xlsx';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      state.showExcelPreview = false;
    } finally {
      if(btn){ btn.disabled = false; btn.textContent = originalText || '⬇ ایکسل ڈاؤن لوڈ کریں'; }
      render();
    }
  }

  function setupSignaturePad(canvas, dayKey){
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1f2937';
    var existing = getSigExisting(dayKey);
    if(existing){
      var img = new Image();
      img.onload = function(){ ctx.drawImage(img, 0, 0, canvas.width, canvas.height); };
      img.src = existing;
    }
    var drawing = false, last = null;
    function pos(evt){
      var rect = canvas.getBoundingClientRect();
      return { x:(evt.clientX-rect.left)*(canvas.width/rect.width), y:(evt.clientY-rect.top)*(canvas.height/rect.height) };
    }
    canvas.addEventListener('pointerdown', function(evt){
      drawing = true; last = pos(evt);
      try{ canvas.setPointerCapture(evt.pointerId); }catch(e){}
      evt.preventDefault();
    });
    canvas.addEventListener('pointermove', function(evt){
      if(!drawing) return;
      var p = pos(evt);
      ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
      last = p; evt.preventDefault();
    });
    function endStroke(){
      if(!drawing) return;
      drawing = false;
      setSigValue(dayKey, canvas.toDataURL('image/jpeg', 0.45));
    }
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointerleave', endStroke);
  }

        state.districts[idx][this.getAttribute('data-key')] = this.value;
      });
      inp.addEventListener('change', function(){ scheduleConfigSave(); render(); });
    });
    document.querySelectorAll('[data-role="district-remove"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.districts.splice(Number(this.getAttribute('data-idx')), 1);
        scheduleConfigSave(); render();
      });
    });
    var addDistrictBtn = document.getElementById('addDistrictBtn');
    if(addDistrictBtn) addDistrictBtn.addEventListener('click', function(){
      state.districts.push({ name:'', officer:'', username:'', password:'' });
      scheduleConfigSave(); render();
    });
    document.querySelectorAll('[data-role="account"]').forEach(function(inp){
      inp.addEventListener('input', function(){ state.settings[this.getAttribute('data-key')] = this.value; });
      inp.addEventListener('change', function(){ scheduleConfigSave(); render(); });
    });

    var previewBtn = document.getElementById('previewBtn');
    if(previewBtn) previewBtn.addEventListener('click', function(){
      state.showExcelPreview = true; render();
    });
    var confirmDlBtn = document.getElementById('confirmDownloadBtn');
    if(confirmDlBtn) confirmDlBtn.addEventListener('click', function(){ handleDownload(this); });
    document.querySelectorAll('[data-role="excel-preview-close"]').forEach(function(btn){ btn.addEventListener('click', closeExcelPreview); });
    var xpOverlay = document.querySelector('[data-role="excel-preview-overlay"]');
    if(xpOverlay) xpOverlay.addEventListener('click', function(e){ if(e.target === xpOverlay) closeExcelPreview(); });

    document.querySelectorAll('[data-role="open-entry"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.entryModalDay = Number(this.getAttribute('data-day'));
        state.entryModalMode = this.getAttribute('data-mode') || 'workshop';
        render();
      });
    });
    document.querySelectorAll('[data-role="modal-close"], [data-role="modal-save"]').forEach(function(btn){ btn.addEventListener('click', closeModal); });
    var overlay = document.querySelector('[data-role="modal-overlay"]');
    if(overlay) overlay.addEventListener('click', function(e){ if(e.target === overlay) closeModal(); });

    document.querySelectorAll('input[data-role="profile"]').forEach(function(inp){
      inp.addEventListener('input', function(){ state.profile[this.getAttribute('data-key')] = this.value; });
      inp.addEventListener('change', function(){ scheduleConfigSave(); });
    });

    var districtInput = document.getElementById('districtInput');
    if(districtInput) districtInput.addEventListener('change', function(){
      updateEntry(Number(this.getAttribute('data-day')), 'district', this.value);
    });

    var dayTypeInput = document.getElementById('dayTypeInput');
    if(dayTypeInput) dayTypeInput.addEventListener('change', function(){
      updateEntry(Number(this.getAttribute('data-day')), 'dayType', this.value);
      render();
    });

    document.querySelectorAll('input[data-role="entry"]').forEach(function(inp){
      inp.addEventListener('input', function(){
        updateEntry(Number(this.getAttribute('data-day')), this.getAttribute('data-key'), this.value);
      });
    });
    document.querySelectorAll('input[data-role="summary"]').forEach(function(inp){
      inp.addEventListener('input', function(){ updateSummary(this.getAttribute('data-key'), this.value); });
    });

    var reopenBtn = document.getElementById('reopenEntryBtn');
    if(reopenBtn) reopenBtn.addEventListener('click', function(){
      var day = state.entryModalDay;
      if(!confirm('کیا آپ واقعی اس دن کا اندراج ترمیم کے لیے دوبارہ کھولنا چاہتے ہیں؟ آفس ذمہ دار کو دوبارہ تصدیق کرنی ہوگی۔')) return;
      var e = state.entries[day];
      e.officeSignature=''; e.officeSignedBy=''; e.officeSignedAt=''; e.officeNote='';
      scheduleSave(); render();
    });

    var confirmSignBtn = document.getElementById('confirmSignBtn');
    if(confirmSignBtn) confirmSignBtn.addEventListener('click', function(){
      var day = state.entryModalDay;
      var e = state.entries[day];
      var nameInput = document.getElementById('officeSignedByInput');
      var name = nameInput ? nameInput.value.trim() : '';
      if(!e || !e.officeSignature){ alert('براہ کرم پہلے دستخط کریں یا دستخط کی تصویر اپلوڈ کریں۔'); return; }
      if(!name){ alert('براہ کرم آفس ذمہ دار کا نام درج کریں۔'); return; }
      e.officeSignedBy = name; e.officeSignedAt = new Date().toISOString(); e.officeNote = '';
      scheduleSave(); closeModal();
    });
    var sendBackBtn = document.getElementById('sendBackBtn');
    if(sendBackBtn) sendBackBtn.addEventListener('click', function(){
      var day = state.entryModalDay;
      var e = state.entries[day];
      var noteInput = document.getElementById('officeNoteInput');
      var note = noteInput ? noteInput.value.trim() : '';
      if(!e) return;
      e.officeSignature=''; e.officeSignedBy=''; e.officeSignedAt='';
      e.officeNote = note || 'اصلاح درکار ہے، براہ کرم تفصیلات دوبارہ چیک کریں۔';
      scheduleSave(); closeModal();
    });

    var divisionApproveBtn = document.getElementById('divisionApproveBtn');
    if(divisionApproveBtn) divisionApproveBtn.addEventListener('click', function(){
      if(!monthReadyForDivision()){
        var pend = pendingDivisionItems();
        alert('ابھی حتمی منظوری نہیں دی جا سکتی — درج ذیل دنوں کی دفتری تصدیق باقی ہے:\n' + pend.join('\n'));
        return;
      }
      var nameInput = document.getElementById('divisionNameInput');
      var name = nameInput ? nameInput.value.trim() : '';
      if(!name){ alert('براہ کرم ڈویژن ذمہ دار کا نام درج کریں۔'); return; }
      if(!state.division.signature){ alert('براہ کرم پہلے دستخط کریں یا دستخط کی تصویر اپلوڈ کریں۔'); return; }
      state.division.signedBy = name;
      state.division.signedAt = new Date().toISOString();
      scheduleSave(); render();
    });
    var revokeBtn = document.getElementById('revokeApprovalBtn');
    if(revokeBtn) revokeBtn.addEventListener('click', function(){
      if(!confirm('کیا آپ واقعی اس ماہ کی حتمی منظوری واپس لینا چاہتے ہیں؟')) return;
      state.division.signedAt = '';
      scheduleSave(); render();
    });

    document.querySelectorAll('.sig-pad').forEach(function(canvas){
      setupSignaturePad(canvas, canvas.getAttribute('data-day') === 'division' ? 'division' : Number(canvas.getAttribute('data-day')));
    });
    document.querySelectorAll('.sig-clear').forEach(function(btn){
      btn.addEventListener('click', function(){
        var dayAttr = this.getAttribute('data-day');
        var dayKey = dayAttr === 'division' ? 'division' : Number(dayAttr);
        var canvas = document.querySelector('.sig-pad[data-day="'+dayAttr+'"]');
        if(canvas){
          var cctx = canvas.getContext('2d');
          cctx.fillStyle = '#ffffff';
          cctx.fillRect(0,0,canvas.width,canvas.height);
        }
        setSigValue(dayKey, '');
      });
    });
    document.querySelectorAll('.sig-upload-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var dayAttr = this.getAttribute('data-day');
        var inp = document.querySelector('.sig-upload-input[data-day="'+dayAttr+'"]');
        if(inp) inp.click();
      });
    });
    document.querySelectorAll('.sig-upload-input').forEach(function(inp){
      inp.addEventListener('change', function(){
        var dayAttr = this.getAttribute('data-day');
        var dayKey = dayAttr === 'division' ? 'division' : Number(dayAttr);
        var file = this.files && this.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(ev){
          var img = new Image();
          img.onload = function(){
            var canvas = document.querySelector('.sig-pad[data-day="'+dayAttr+'"]');
            if(!canvas) return;
            var ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            var scale = Math.min(canvas.width/img.width, canvas.height/img.height);
            var w = img.width*scale, h = img.height*scale;
            ctx.drawImage(img, (canvas.width-w)/2, (canvas.height-h)/2, w, h);
            setSigValue(dayKey, canvas.toDataURL('image/jpeg', 0.45));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    });
  }

  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;
    if(state.showExcelPreview) closeExcelPreview();
    else if(state.entryModalDay) closeModal();
  });

  // ---------------- init ----------------
  (async function init(){
    render();
    var guessKey = monthKey(); // year/month are still at their defaults here, before any user interaction
    var monthRemoteP = fetchFromSheet(guessKey);
    var monthLocalP = storageGet(guessKey);
    await loadProfile();
    render();
    if(state.session && state.role !== 'admin') await loadMonth(monthRemoteP, monthLocalP);
    else { state.loading = false; render(); }
  })();

})();
</script>
</body>
</html>
